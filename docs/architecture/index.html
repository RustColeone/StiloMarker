<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Stilo Marker · Architecture</title>
  <link rel="icon" href="../../assets/icons/stliomarker-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="data.js"></script>
  <script defer src="diagram.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <nav class="top-links" aria-label="Pages">
      <a class="brand" href="#/">Stilo Marker <span>architecture</span></a>
      <a class="guide-link" href="#/guide/extensions"><span class="long">How an extension goes in</span><span class="short">Extension guide</span></a>
      <a class="guide-link" href="#/guide/changes"><span class="long">How a change goes in</span><span class="short">Change guide</span></a>
    </nav>
    <div class="search">
      <label class="visually-hidden" for="search">Find a module, file or function</label>
      <input id="search" type="search" placeholder="Find a module, file or function…" autocomplete="off">
      <ol class="results" id="results" hidden></ol>
    </div>
  </header>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <main class="layout">
    <section class="chart" aria-label="Flow chart">
      <div class="chart-head">
        <div><h1 id="chart-title"></h1><p id="chart-hint"></p></div>
      </div>
      <div class="chart-frame">
        <div class="chart-body" id="chart"></div>
        <div class="zoom" id="zoom" role="group" aria-label="Zoom" hidden>
          <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
          <button type="button" id="zoom-level" title="Back to 100%">100%</button>
          <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
          <button type="button" id="zoom-fit" title="Fit the whole diagram (0)">Fit</button>
          <button type="button" id="zoom-full" aria-label="Full screen" title="Full screen">
            <svg class="open" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
            <svg class="close" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
          </button>
        </div>
        <p class="chart-help">Drag to move · scroll or pinch to zoom · click a box to go in</p>
      </div>
    </section>
    <aside class="pane" id="pane" aria-label="Details"></aside>
  </main>
  <noscript>This page draws the code's architecture with JavaScript; please enable it.</noscript>
</body>
</html>
