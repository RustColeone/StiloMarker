name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Node and Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Node.js unit tests
        run: node --test tests/

      - name: Release labels and generated copies agree
        run: |
          node tools/release-version.mjs --check
          node tools/protocol-sync.mjs --check

      # Every server suite and the backend end to end over HTTP (the self-test
      # was mdnotes_server.py --selftest until v0.1.41). The browser suites need
      # Playwright and a display: they run on the developer's machine.
      - name: Run the Python suites
        run: for t in tests/*.test.py tests/backend-selftest.py; do echo "== $t"; python3 -B "$t" || exit 1; done
